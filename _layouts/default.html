<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24273a">
  <meta name="color-scheme" content="dark">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="preload" href="{{ '/assets/jost-v4-latin-regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  <script src="{{ '/assets/blog.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <button class="menu-toggle" type="button" aria-controls="site-sidebar" aria-expanded="false" data-menu-toggle><span aria-hidden="true">☰</span> Menu</button>
  <button class="menu-backdrop" type="button" aria-label="Close navigation" tabindex="-1" data-menu-backdrop hidden></button>
  <div class="site-shell">
    {% include navigation.html %}
    <main class="content-column" id="main">
      {{ content }}
    </main>
  </div>
</body>
</html>
