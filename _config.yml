title: Everett’s blog
description: Notes on computer science, mathematics, software, books, and design.
url: https://blog.everett.moe
baseurl: ""

author:
  name: Everett Xu
  url: https://everett.moe

# Preserve the existing Disqus discussion identifiers.
disqus: everett-boo

markdown: kramdown
permalink: /:year-:month-:day/:title
paginate: 5
paginate_path: /page/:num/
timezone: America/New_York

sass:
  quiet_deps: true
  silence_deprecations:
    - import

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - _site
